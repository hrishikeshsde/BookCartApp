name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, format, test)
    runs-on: ubuntu-latest
    services:
      # The tests host the real API on a throwaway database that is dropped and rebuilt with the real migrations on every
      # run. LocalDB (the local default) does not exist on Linux, so they get a SQL Server container instead.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_only_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_only_Passw0rd!' -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    env:
      # Never point this at a real database: the test fixture drops it.
      BOOKCART_TEST_DB: Server=localhost,1433;Database=BookDB_Test;User Id=sa;Password=Ci_only_Passw0rd!;TrustServerCertificate=True
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore BookCart.slnx
      - name: Check formatting
        run: dotnet format BookCart.slnx --verify-no-changes --no-restore
      # Release: a Debug build of the web project also installs the Angular client's packages, which this job does not need.
      - name: Build (warnings are errors)
        run: dotnet build BookCart.slnx -c Release --no-restore
      - name: Test
        run: dotnet test BookCart.Tests -c Release --no-build --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore

  frontend:
    name: Frontend (unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BookCart/ClientApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BookCart/ClientApp/package-lock.json
      - run: npm ci
      # Vitest runs the specs in jsdom, so no browser is needed.
      - run: npm test
      - run: npm run build -- --configuration production
      # Every file the pages and the CSS refer to exists, and no inline script or handler (the CSP would block it).
      - run: npm run verify:dist

  stack:
    name: Docker stack (deploy, update, browser checks)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Nothing here is pushed anywhere: the job builds the two images from the Dockerfile, starts the stack exactly as
      # a server would (deploy/deploy.sh), and then checks it. The first run has no deploy/.env, so the script creates
      # one (plain HTTP on port 8080, generated secrets): the empty line answers its "domain" question.
      - name: Deploy (first run)
        run: printf '\n' | bash deploy/deploy.sh
      - name: Check the deployment
        run: bash deploy/verify.sh
      # The update path of a real server: the database exists now, so this backs it up, applies nothing and replaces
      # the containers with a new release.
      - name: Deploy again (update)
        run: bash deploy/deploy.sh -y
      - name: The update made a verified backup
        run: ls -l deploy/backups/BookDB_*.bak
      - name: Check the deployment again
        run: bash deploy/verify.sh
      - name: Find Chrome
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
      - name: Install the browser checks
        working-directory: scripts/smoke
        run: npm ci
      # A Chrome click-through of the deployed site (guest cart, registration, login, checkout, wishlist, admin). The
      # smoke admin is made an administrator with deploy/make-admin.sh, which is the way a real owner does it.
      - name: Browser smoke test
        working-directory: scripts/smoke
        env:
          API: http://localhost:8080
          WEB: http://localhost:8080
          PROMOTE_ADMIN_CMD: bash ${{ github.workspace }}/deploy/make-admin.sh smokeadmin
        run: node smoke.js --expect-f1
      # Failed requests, console errors, Content-Security-Policy violations and missing fonts on every kind of page.
      - name: Page checks
        working-directory: scripts/smoke
        env:
          WEB: http://localhost:8080
        run: node pages.js
      - name: Logs of the stack
        if: failure()
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml --profile '*' logs --no-color --tail 200 || true
      - name: Stop the stack and delete its data
        if: always()
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml --profile '*' down -v || true
