@if (showButton()) {
<button
  type="button"
  [matButton]="selected() ? 'tonal' : 'filled'"
  [class.wishlisted]="selected()"
  [class.not-wishlisted]="!selected()"
  (click)="toggleValue()"
>
  {{ buttonText() }}
</button>
} @else {
<button
  type="button"
  class="heart"
  [class.favourite-selected]="selected()"
  [class.favourite-unselected]="!selected()"
  [attr.aria-label]="heartLabel()"
  (click)="toggleValue()"
>
  <span class="material-icons" aria-hidden="true">favorite</span>
</button>
}
