@if (showButton()) {
<button
  [ngClass]="{ wishlisted: selected(), 'not-wishlisted': !selected() }"
  mat-raised-button
  (click)="toggleValue()"
>
  {{ buttonText() }}
</button>
} @else {
<span
  (click)="toggleValue()"
  [ngClass]="{
    'favourite-selected': selected(),
    'favourite-unselected': !selected()
  }"
  class="material-icons"
>
  favorite
</span>
}
