@if (bookData(); as bookData) {
<h2 mat-dialog-title>Do you want to delete this item?</h2>
<mat-dialog-content>
  <table>
    <tbody>
      <tr>
        <td><strong>BookId</strong></td>
        <td>{{ bookData.bookId }}</td>
      </tr>
      <tr>
        <td><strong>Title</strong></td>
        <td>{{ bookData.title }}</td>
      </tr>
      <tr>
        <td><strong>Author</strong></td>
        <td>{{ bookData.author }}</td>
      </tr>
      <tr>
        <td><strong>Category</strong></td>
        <td>{{ bookData.category }}</td>
      </tr>
      <tr>
        <td><strong>Price</strong></td>
        <td>{{ bookData.price | currency : "INR" }}</td>
      </tr>
    </tbody>
  </table>
</mat-dialog-content>
<mat-dialog-actions align="end" class="mx-4">
  <button
    matButton="filled"
    class="danger"
    [mat-dialog-close]="1"
    tabindex="-1"
    (click)="confirmDelete()"
  >
    Delete
  </button>
  <button matButton="tonal" (click)="onNoClick()">Cancel</button>
</mat-dialog-actions>
}
