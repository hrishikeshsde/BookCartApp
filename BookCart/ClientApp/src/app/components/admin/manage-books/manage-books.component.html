@if (bookTableData(); as bookTableData) {
<mat-card class="my-6">
  <mat-card-header class="custom-card-header justify-between">
    <mat-card-title><h1 class="card-heading">All Books</h1></mat-card-title>
    <div>
      <button
        matButton="tonal"
        [routerLink]="['/admin/books/new']"
      >
        Add Book
      </button>
    </div>
  </mat-card-header>
  @if (bookTableData.data.length > 0) {
  <div>
    <mat-card-content>
      <mat-form-field class="w-full" appearance="outline">
        <mat-label>Search</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Search" />
      </mat-form-field>
      <div class="overflow-x-auto rounded-lg shadow-level-1">
        <table mat-table [dataSource]="bookTableData" matSort>
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let row">{{ row.bookId }}</td>
          </ng-container>
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
            <td mat-cell *matCellDef="let row">{{ row.title }}</td>
          </ng-container>
          <ng-container matColumnDef="author">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Author</th>
            <td mat-cell *matCellDef="let row">{{ row.author }}</td>
          </ng-container>
          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
            <td mat-cell *matCellDef="let row">{{ row.category }}</td>
          </ng-container>
          <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
            <td mat-cell *matCellDef="let row">
              {{ row.price | currency : "INR" }}
            </td>
          </ng-container>
          <ng-container matColumnDef="operation">
            <th mat-header-cell *matHeaderCellDef>Operation</th>
            <td mat-cell *matCellDef="let row">
              <button
                matIconButton
                class="icon-primary"
                [attr.aria-label]="'Edit ' + row.title"
                [routerLink]="['/admin/books/', row.bookId]"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                matIconButton
                class="danger"
                [attr.aria-label]="'Delete ' + row.title"
                (click)="deleteConfirm(row.bookId)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
          ></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell p-2" colspan="2">
              No data matching the filter
            </td>
          </tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 25, 50]"></mat-paginator>
      </div>
    </mat-card-content>
  </div>
  } @else {
  <mat-card-header>
    <mat-card-title class="card-heading">No books found</mat-card-title>
  </mat-card-header>
  }
</mat-card>
}
