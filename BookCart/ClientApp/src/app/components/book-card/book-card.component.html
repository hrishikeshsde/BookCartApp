<mat-card
  class="book-card h-full w-full"
  [class.on-book-card-hover]="isActive()"
  (mouseover)="isActive.set(true)"
  (mouseout)="isActive.set(false)"
>
  <!-- The title below is the link for keyboards and screen readers; this one only makes the picture clickable. -->
  <a
    class="cover"
    [routerLink]="['/books/details/', book().bookId]"
    tabindex="-1"
    aria-hidden="true"
  >
    <img
      [ngSrc]="'/Upload/' + book().coverFileName"
      fill
      sizes="(min-width: 48rem) 11rem, 45vw"
      [priority]="priority()"
      [alt]="book().title + ' cover'"
    />
  </a>
  @if (signedIn()) {
  <div class="favourite">
    <app-addtowishlist
      [bookId]="book().bookId"
      [bookTitle]="book().title"
      [wishlisted]="wishlisted()"
      (toggle)="toggleWishlist.emit($event)"
    ></app-addtowishlist>
  </div>
  }
  <mat-card-content class="body">
    <h2 class="title">
      <a [routerLink]="['/books/details/', book().bookId]">{{ book().title }}</a>
    </h2>
    <p class="price">{{ book().price | currency : "INR" }}</p>
    <app-addtocart
      [bookId]="book().bookId"
      [bookTitle]="book().title"
      (add)="addToCart.emit($event)"
    ></app-addtocart>
  </mat-card-content>
</mat-card>
