<mat-nav-list class="shadow-level-1 rounded-xl bg-surface-container-low" aria-label="Categories">
  <a mat-list-item routerLink="/" [activated]="!category()">
    All Categories
  </a>
  @for (c of categories(); track c.categoryId) {
  <a
    mat-list-item
    routerLink="/filter"
    [queryParams]="{ category: c.categoryName | lowercase }"
    [activated]="category() == (c.categoryName | lowercase)"
  >
    {{ c.categoryName }}
  </a>
  }
</mat-nav-list>
