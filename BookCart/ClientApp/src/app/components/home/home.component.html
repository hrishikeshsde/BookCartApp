<div class="row no-gutters pt-3">
  <div class="col-md-3 col-sm-12">
    <div class="filter-container">
      <app-book-filter
        [category]="category() ?? ''"
        [categories]="categories()"
      ></app-book-filter>
      <app-price-filter
        [range]="priceRange()"
        (priceChange)="priceFilter.set($event)"
      ></app-price-filter>
    </div>
  </div>
  <div class="col mb-3">
    @if (visibleBooks().length > 0) {
    <div class="d-flex justify-content-start card-deck-container mb-4">
      @for (book of visibleBooks(); track book.bookId) {
      <div class="p-1">
        <app-book-card
          [book]="book"
          [signedIn]="signedIn()"
          [wishlisted]="wishlistedIds().has(book.bookId)"
          (addToCart)="addToCart($event)"
          (toggleWishlist)="toggleWishlist($event)"
        ></app-book-card>
      </div>
      }
    </div>
    } @else if (firstLoad()) {
    <div class="d-flex align-items-center justify-content-center mt-4">
      <mat-spinner></mat-spinner>
    </div>
    } @else {
    <div class="d-flex justify-content-center mt-4">
      <h1 class="display-4">No books found.</h1>
    </div>
    }
  </div>
</div>
