<mat-card class="my-6">
  <mat-card-header class="custom-card-header">
    <mat-card-title class="card-heading"> Similar Books </mat-card-title>
  </mat-card-header>
  <mat-card-content class="p-4">
    @if (loading()) {
    <div class="flex items-center justify-center">
      <mat-spinner></mat-spinner>
    </div>
    } @else {
    <ul class="grid list-none grid-cols-2 gap-3 p-0 m-0 sm:grid-cols-[repeat(auto-fill,minmax(10.5rem,1fr))] sm:gap-4">
      @for (book of books(); track book.bookId) {
      <li class="flex">
        <app-book-card
          class="w-full"
          [book]="book"
          [signedIn]="signedIn()"
          [wishlisted]="wishlistedIds().has(book.bookId)"
          (addToCart)="addToCart.emit($event)"
          (toggleWishlist)="toggleWishlist.emit($event)"
        ></app-book-card>
      </li>
      }
    </ul>
    }
  </mat-card-content>
</mat-card>
