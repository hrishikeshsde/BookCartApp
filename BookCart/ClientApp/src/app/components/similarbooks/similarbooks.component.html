<mat-card class="my-4">
  <mat-card-header class="mat-elevation-z2 custom-card-header">
    <mat-card-title class="mat-h1"> Similar Books </mat-card-title>
  </mat-card-header>
  <mat-card-content class="p-3">
    @if (loading()) {
    <div class="d-flex align-items-center justify-content-center">
      <mat-spinner></mat-spinner>
    </div>
    } @else {
    <div class="d-flex justify-content-start flex-wrap">
      @for (book of books(); track book.bookId) {
      <div class="p-1">
        <app-book-card
          [book]="book"
          [signedIn]="signedIn()"
          [wishlisted]="wishlistedIds().has(book.bookId)"
          (addToCart)="addToCart.emit($event)"
          (toggleWishlist)="toggleWishlist.emit($event)"
        ></app-book-card>
      </div>
      }
    </div>
    }
  </mat-card-content>
</mat-card>
