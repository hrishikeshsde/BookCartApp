# Production stack for one Docker host: SQL Server + the BookCart image.
# Start it with scripts\release.bat (it builds the image, creates deploy\.env, applies migrations and starts everything).
# Settings come from deploy\.env (see .env.example); that file holds secrets and is git-ignored.
name: bookcart

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookcart-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?run scripts\release.bat once to create deploy\.env}
    ports:
      # Localhost only: the migrations are applied from the host. Nothing outside this machine can reach the database.
      - "127.0.0.1:${SQL_PORT:-14331}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # New named volumes are owned by root, but the app runs as uid 1654 and could not write uploads or its keys.
  init-volumes:
    image: bookcart:${BOOKCART_TAG:-latest}
    user: "0"
    entrypoint: ["chown", "-R", "1654:1654", "/data/uploads", "/data/keys"]
    restart: "no"
    volumes:
      - uploads:/data/uploads
      - keys:/data/keys

  app:
    image: bookcart:${BOOKCART_TAG:-latest}
    container_name: bookcart-app
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      init-volumes:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=BookDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
      Jwt__SecretKey: ${JWT_SECRET:?JWT_SECRET is missing in deploy\.env}
      Jwt__Issuer: ${JWT_ISSUER:-http://localhost:8080/}
      Jwt__Audience: ${JWT_AUDIENCE:-http://localhost:8080/}
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Storage__UploadFolder: /data/uploads
      Security__DataProtectionKeysPath: /data/keys
      # Behind a reverse proxy that terminates TLS, also set: ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
      - keys:/data/keys

volumes:
  sqldata:
  uploads:
  keys:
